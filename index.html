<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cafe 99 Menu</title>
<style>
:root{--bg:#121110;--card:#1c1a17;--tx:#f5f1e6;--mu:#a9a293;--ac:#f5c518;--bd:#3a3220;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hero{text-align:center;padding:28px 16px 18px;background:radial-gradient(ellipse at top,#3a2c0c 0,#121110 72%)}
.hero svg{width:58px;height:58px}
.hero h1{margin:4px 0 0;font:700 38px Georgia,serif;letter-spacing:4px;color:var(--ac)}
.hero p{margin:6px 0 0;color:#d8c88e;font-size:12px;letter-spacing:3px;text-transform:uppercase}
.hero i{display:block;width:70px;height:2px;background:linear-gradient(90deg,transparent,#f5c518,transparent);margin:14px auto 0}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:#121110ee;backdrop-filter:blur(8px);z-index:5;padding:8px 12px;border-bottom:1px solid var(--bd)}
#q{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;margin-bottom:8px}
#chips{display:flex;gap:8px;overflow-x:auto}
#chips a{white-space:nowrap;padding:6px 12px;border-radius:999px;border:1px solid #4a3c14;background:#1c1a17;color:var(--ac);text-decoration:none;font-size:13px}
main{padding:8px 12px 40px;max-width:640px;margin:0 auto}
section{margin-top:20px;scroll-margin-top:110px}
.bn{position:relative;height:110px;border-radius:18px;overflow:hidden;display:flex;align-items:center;padding:0 18px;border:1px solid #4a3c14;margin-bottom:6px}
.bn h2{margin:0;font:700 26px Georgia,serif;color:var(--ac);max-width:62%}
.bn svg{position:absolute;right:10px;top:50%;width:92px;height:92px;transform:translateY(-50%) rotate(-8deg);filter:drop-shadow(0 6px 8px #0007)}
.note{font-size:12px;color:var(--mu);margin:0 0 4px 4px;font-style:italic}
.it{display:flex;align-items:center;gap:12px;padding:10px;background:linear-gradient(180deg,#201d18,#181612);border:1px solid var(--bd);border-radius:16px;margin-top:8px;animation:f .5s both}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ic{flex:none;width:58px;height:58px;border-radius:14px;background:radial-gradient(circle at 30% 25%,#4a3d1c,#1e1a10);display:flex;align-items:center;justify-content:center}
.ic svg{width:46px;height:46px}
.nm{flex:1;font-weight:500;line-height:1.25}
.p{font-weight:700;color:var(--ac);white-space:nowrap}
.mm{display:block}
.mm .top{display:flex;align-items:center;gap:12px}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px}
.g div{text-align:center;background:#14120e;border-radius:10px;padding:6px 0;font-size:10px;color:var(--mu)}
.g svg{width:28px;height:28px;display:block;margin:0 auto 2px}
.g b{display:block;color:var(--ac);font-size:12px;margin-top:2px}
#none{display:none;text-align:center;color:var(--mu);margin-top:30px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:0 0 24px}
</style></head><body>
<div class="hero"><svg viewBox="0 0 64 64"><path d="M26 4Q22 10 27 15M34 2Q30 9 35 15" stroke="#f5c518" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M12 24H48V36Q48 50 30 50Q12 50 12 36Z" fill="#f5c518"/><path d="M48 28H54Q58 28 58 33Q58 40 48 40" stroke="#f5c518" stroke-width="3" fill="none"/><rect x="8" y="53" width="44" height="4" rx="2" fill="#f5c518"/></svg><h1>CAFE 99</h1><p>Burger · Pizza · Momos &amp; More</p><i></i></div>
<nav><input id="q" type="search" autocomplete="off" placeholder="Search food or drink..." aria-label="Search"><div id="chips"></div></nav>
<main id="m"></main><div id="none">No items found. <a href="#" id="clr" style="color:#f5c518">Show full menu</a></div>
<footer>Prices in ₹ · May change · Thank you for visiting!</footer>

fries:function(c){return S('<g fill="#f7c948"><rect x="16" y="8" width="6" height="30" rx="2" transform="rotate(-10 19 30)"/><rect x="24" y="6" width="6" height="32" rx="2"/><rect x="33" y="8" width="6" height="30" rx="2"/><rect x="41" y="10" width="6" height="28" rx="2" transform="rotate(10 44 30)"/></g><path d="M14 34H50L45 60H19Z" fill="#d6322b"/><circle cx="32" cy="46" r="6" fill="'+c+'"/>')},
sand:function(c){return S('<rect x="8" y="42" width="48" height="10" rx="4" fill="#e9c47c"/><rect x="10" y="36" width="44" height="6" rx="3" fill="#58b04a"/><rect x="10" y="30" width="44" height="6" rx="3" fill="'+c+'"/><rect x="8" y="16" width="48" height="14" rx="6" fill="#f2d49b"/><path d="M44 6L38 24" stroke="#c99a4d" stroke-width="2"/><circle cx="44" cy="6" r="3" fill="#d6322b"/>')},
noodle:function(c){return S('<path d="M6 34H58Q56 57 32 57Q8 57 6 34Z" fill="#e8e1d2"/><path d="M10 33Q16 12 24 30T38 28T52 32" stroke="'+c+'" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M14 34Q22 18 30 32T50 34" stroke="'+c+'" stroke-width="5" fill="none" stroke-linecap="round"/><g><circle cx="26" cy="26" r="2.5" fill="#58b04a"/><circle cx="40" cy="25" r="2.5" fill="#e8742a"/><circle cx="33" cy="31" r="2.5" fill="#58b04a"/></g>')},
rice:function(c){return S('<path d="M6 36H58Q56 57 32 57Q8 57 6 36Z" fill="#e8e1d2"/><path d="M10 37Q12 14 32 14Q52 14 54 37Z" fill="'+c+'"/><g><circle cx="24" cy="28" r="2.6" fill="#58b04a"/><circle cx="36" cy="22" r="2.6" fill="#e8742a"/><circle cx="42" cy="31" r="2.6" fill="#58b04a"/><circle cx="30" cy="32" r="2.6" fill="#d6322b"/></g>')},
gravy:function(c){return S('<path d="M6 34H58Q56 57 32 57Q8 57 6 34Z" fill="#e8e1d2"/><ellipse cx="32" cy="34" rx="26" ry="7" fill="'+c+'"/><g fill="#c98a3a" stroke="#0003"><circle cx="21" cy="28" r="7"/><circle cx="34" cy="25" r="7"/><circle cx="45" cy="30" r="6"/></g><path d="M20 18Q22 12 26 8M36 16Q38 10 42 6" stroke="#fff6" stroke-width="2" fill="none"/>')},
pasta:function(c){return S('<circle cx="32" cy="33" r="27" fill="#f1ece0"/><circle cx="32" cy="33" r="20" fill="'+c+'"/><path d="M32 33m-3 0a3 3 0 1 1 6 0a7 7 0 1 1-14 0a11 11 0 1 1 22 0" stroke="#f3d27a" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="40" cy="22" r="2.4" fill="#58b04a"/>')},
roll:function(c){return S('<g transform="rotate(-18 32 32)"><path d="M10 34H46L42 52H14Z" fill="#cfd4da"/><rect x="8" y="20" width="48" height="22" rx="11" fill="#e9c47c"/><ellipse cx="52" cy="31" rx="5" ry="9" fill="'+c+'"/></g>')},

soda:function(c){return S('<path d="M18 8H46L43 58H21Z" fill="'+c+'"/><path d="M18 8H46L45.6 16H18.4Z" fill="#fff6"/><g fill="#fff7"><circle cx="28" cy="40" r="3"/><circle cx="37" cy="30" r="2.5"/><circle cx="33" cy="48" r="2"/><circle cx="26" cy="26" r="2"/></g><path d="M38 2L33 30" stroke="#fff" stroke-width="3"/><circle cx="48" cy="10" r="7" fill="#c9e265"/>')},
shake:function(c,t){return S('<path d="M16 24H48L44 59H20Z" fill="'+c+'"/><path d="M14 24Q16 8 32 10Q48 8 50 24Z" fill="'+(t||'#fff')+'"/><circle cx="32" cy="9" r="4" fill="#c0132b"/><path d="M42 4L36 24" stroke="#fff" stroke-width="3"/>')},
cream:function(c){return S('<path d="M19 34L32 61L45 34Z" fill="#d9a05b"/><circle cx="32" cy="27" r="14" fill="'+c+'"/><circle cx="32" cy="14" r="10" fill="#fff0d2"/><circle cx="32" cy="5" r="3" fill="#c0132b"/>')},
brown:function(v){return S('<rect x="8" y="30" width="48" height="24" rx="4" fill="#4a2616"/><path d="M8 38H56" stroke="#7a4326" stroke-width="3"/><path d="M12 33Q22 26 32 33T52 33" stroke="#fff" stroke-width="2.5" fill="none"/>'+(v==1?'<circle cx="32" cy="20" r="10" fill="#fff0d2"/><circle cx="32" cy="9" r="3" fill="#c0132b"/>':'')+(v==2?'<path d="M18 28Q14 18 20 10Q22 18 26 20Q24 12 30 4Q34 16 36 20Q40 14 42 8Q48 20 44 28Z" fill="#ff7a1a"/>':''))},
cheese:function(){return S('<path d="M6 42L58 24V52H6Z" fill="#f7c531"/><path d="M6 42L58 24V30L6 48Z" fill="#fde27a"/><circle cx="22" cy="46" r="3" fill="#d9a21e"/><circle cx="40" cy="42" r="4" fill="#d9a21e"/><circle cx="50" cy="36" r="2" fill="#d9a21e"/>')}
};
var K=[['mango','#ffb21e'],['strawberry','#ff5e8a'],['lichi','#f6b8c8'],['pine','#ffd84a'],['vanilla','#f6e7b8'],['chocolate','#6b3a1e'],['oreo','#4a4a52'],['kit','#8a4a2a'],['scotch','#f0b24a'],['brownie','#6b3a1e'],['blue','#2aa8f2'],['mint','#5ed67a'],['virgin','#a8e063'],['green','#8bd13f'],['lime','#d6e86a'],['masala','#9b4a2b'],['coffee','#7a4a2a']];
function col(n){n=n.toLowerCase();for(var i=0;i<K.length;i++)if(n.indexOf(K[i][0])>-1)return K[i][1];return '#f08a5d'}
function has(n,w){return n.toLowerCase().indexOf(w)>-1}
function icon(s,n){
 var l=n.toLowerCase();
 if(l.indexOf('extra')==0)return I.cheese();
 switch(s){
 case 'Pizza':var t=has(l,'onion capsicum')?'#7fbf4a':has(l,'onion')?'#c9a0dc':has(l,'mushroom')?'#cbb08a':has(l,'baby')?'#ffe566':has(l,'paneer')?'#fff1b8':has(l,'tandoori')?'#e5532d':has(l,'farm')?'#58b04a':has(l,'special')||has(l,'lover')?'#b3202a':has(l,'cheese')?'#f9e08a':has(l,'burger')?'#6b3a1e':'#58b04a';return I.pizza(t);
 case 'Burger & Fries':return has(l,'fry')?I.fries(has(l,'peri')?'#d6322b':has(l,'masala')?'#e8742a':'#c0392b'):I.burger(has(l,'paneer')?'#f2d49b':has(l,'special')?'#8a3b1e':'#6b3a1e');
 case 'Sandwich':return I.sand(has(l,'paneer')?'#e8742a':has(l,'special')?'#f7c531':has(l,'cheese')?'#f7c531':'#e55b4b');
 case 'Chinese Food':return has(l,'chowmein')?I.noodle('#e0a53a'):has(l,'maggi')?I.noodle('#f2c94c'):has(l,'rice')?I.rice(has(l,'mix')?'#e8d49a':'#f3e7b5'):I.gravy(has(l,'manchurian')?'#5a2e12':'#c0392b');
 case 'Pasta':return I.pasta(has(l,'white')?'#f7efd9':'#d6452d');
 case 'Rolls':return I.roll(has(l,'mushroom')?'#b99a78':'#e8742a');
 case 'Mojito & Soda':return (has(l,'soda')||has(l,'cola'))?I.soda(col(l)):I.glass(col(l));
 case 'Shakes':return I.shake(col(l),'#fff');
 default:return has(l,'cold coffee')?I.shake('#7a4a2a',has(l,'ice')?'#fff0d2':'#e8d2b0'):has(l,'ice-cream')?I.cream('#f2a0b8'):I.brown(has(l,'sundae')?1:has(l,'sizzler')?2:0)}
}
var M=[
["Momos","",[["Veg",60,70,110,130,130],["Paneer",80,90,130,150,150],["Mushroom",80,90,130,150,150],["Exotic",80,90,130,150,150]],"t"],
["Pizza","",[["Burger Pizza (Bun Base)","120"],["Cheese Pizza","150"],["Onion Pizza","150"],["Onion Capsicum Pizza","160"],["Farm House Pizza","170"],["Mushroom Pizza","190"],["Tandoori Pizza","190"],["Baby Corn Pizza","190"],["Condilite Pizza","190"],["Paneer Tikka Pizza","210"],["Special Pizza","220"],["C99 Spl. Lover's Pizza","250"],["Extra Cheese","30"],["Extra Topping","30"]]],
["Burger & Fries","",[["Aloo Tikki Burger","60"],["Cheese Burger","80"],["Paneer Burger","80"],["Special Burger","90"],["French Fry","80"],["French Fry (Peri-Peri)","90"],["French Fry (Masala)","100"]]],
["Sandwich","2 slice",[["Veg Sandwich","30"],["Cheese Sandwich","40"],["Cheese Grilled","50"],["Paneer Tikka Grilled","60"],["C99 Special Sandwich (4 slice, extra cheese)","120"]]],
["Chinese Food","Half / Full",[["Veg Chowmein","70 / 140"],["Paneer Chowmein","80 / 160"],["Veg Fried Rice","70 / 140"],["Paneer Fried Rice","90 / 180"],["Mushroom Fried Rice","90 / 180"],["Mix Fried Rice","100 / 200"],["Paneer Chilly","90 / 180"],["Mushroom Chilly","90 / 180"],["Veg Manchurian","80 / 160"],["Paneer Manchurian","90 / 160"],["Baby Corn Crispy","100 / 200"],["Baby Corn Chilly","100 / 200"],["Maggi","70"],["Potato Chilly","120"]]],
["Pasta","Penne / Spaghetti",[["Red Sauce Pasta","150"],["White Sauce Pasta","150"]]],
["Rolls","",[["Paneer Chilli Roll","120"],["Mushroom Chilly Roll","130"]]],
["Mojito & Soda","",[["Blue Lagoon","70"],["Mint Mojito","70"],["Virgin Mojito","70"],["Green Apple Mojito","70"],["Fresh Lime Soda","50"],["Lichi Soda","60"],["Mango Soda","60"],["Butter Scotch Soda","60"],["Green Apple Soda","60"],["Pine Apple Soda","60"],["Strawberry Soda","60"],["Masala Cola","60"]]],
["Shakes","Plain / With Ice-Cream",[["Pine Apple Shake","80 / 100"],["Vanilla Shake","80 / 100"],["Chocolate Shake","80 / 100"],["Strawberry Shake","80 / 100"],["Mango Shake","80 / 100"],["Lichi Shake","80 / 100"],["Butter Scotch Shake","80 / 100"],["Brownie Shake","80 / 100"],["Oreo Shake","80 / 100"],["Kit-Kat Shake","100 / 120"]]],
["Cold Coffee & Desserts","",[["Cold Coffee","90"],["Cold Coffee (with Ice-Cream)","110"],["Ice-Cream (2 scoops)","70"],["Brownie","60"],["Brownie Sundae","120"],["Brownie Sizzler","160"]]]
];
var BG=['#4a2a0c','#4a1a12','#3a2a0a','#40300e','#3a1a14','#3d2210','#3a2a0c','#0e3a40','#4a1a30','#321e12'];
var BI=[function(){return I.momo('#f4ead3')},function(){return I.pizza('#d33')},function(){return I.burger('#6b3a1e')},function(){return I.sand('#f7c531')},function(){return I.noodle('#e0a53a')},function(){return I.pasta('#d6452d')},function(){return I.roll('#e8742a')},function(){return I.glass('#2aa8f2')},function(){return I.shake('#ff5e8a')},function(){return I.brown(1)}];
var ST=[['Steam','#f4ead3'],['Fry','#d9983a'],['Kurkure','#e07a1f'],['Schezwan','#c0392b'],['Tandoor','#e8501c']];
var m=document.getElementById('m'),ch=document.getElementById('chips');
function E(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function draw(f){
 var h='',c='',n=0;
 M.forEach(function(s,i){
  var rows=s[2].filter(function(r){return !f||r[0].toLowerCase().indexOf(f)>-1||s[0].toLowerCase().indexOf(f)>-1});
  if(!rows.length)return;n+=rows.length;
  h+='<section id="s'+i+'"><div class="bn" style="background:linear-gradient(110deg,'+BG[i]+',#15120a)"><h2>'+E(s[0])+'</h2>'+BI[i]()+'</div>';
  if(s[1])h+='<p class="note">'+E(s[1])+'</p>';
  rows.forEach(function(r){
   if(s[3]==='t'){
    h+='<div class="it mm"><div class="top"><div class="ic">'+I.momo(r[0]=='Veg'?'#cfe6b0':r[0]=='Paneer'?'#fff1c9':r[0]=='Mushroom'?'#d8c2a0':'#f1d6e0')+'</div><div class="nm">'+E(r[0])+' Momos</div></div><div class="g">'+ST.map(function(t,j){return '<div>'+I.momo(t[1])+t[0]+'<b>₹'+r[j+1]+'</b></div>'}).join('')+'</div></div>';
   }else h+='<div class="it"><div class="ic">'+icon(s[0],r[0])+'</div><div class="nm">'+E(r[0])+'</div><span class="p">₹'+E(r[1])+'</span></div>';
  });
  h+='</section>';c+='<a href="#s'+i+'">'+E(s[0])+'</a>';
 });
 m.innerHTML=h;ch.innerHTML=c;
 document.getElementById('none').style.display=n?'none':'block';
}
document.getElementById('q').addEventListener('input',function(e){draw(e.target.value.trim().toLowerCase())});
draw('');
document.getElementById('clr').onclick=function(e){e.preventDefault();document.getElementById('q').value='';draw('')};
window.addEventListener('pageshow',function(){document.getElementById('q').value='';draw('')});
</script></body></html>
